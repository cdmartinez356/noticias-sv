<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias SV - Tu Canal de Noticias</title>
  
  <!-- Tipografía Lora desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO SECTION -->
  <header class="hero">
    <!-- Overlay Oscuro -->
    <div class="hero-overlay"></div>

    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="navbar-container">
        <!-- Logo -->
        <a href="#" class="logo-link">
          <img src="imagenes/Logo.svg" alt="Noticias SV" class="logo-img">
        </a>

        <!-- Botón Hamburguesa (Móvil) -->
        <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Abrir menú de navegación" aria-controls="nav-menu" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <!-- Menú de Navegación -->
        <ul class="nav-menu" id="nav-menu">
          <li class="mobile-menu-heading" aria-hidden="true">Explora Noticias</li>
          <li class="nav-item"><a href="#" class="nav-link active">Inicio</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Relevante</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Deportes</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Clima</a></li>
        </ul>
      </div>
    </nav>

    <!-- CONTENIDO DEL HERO -->
    <div class="hero-content">
      <h1 class="hero-title">Tu Canal de Noticias</h1>
      <p class="hero-description">
        Deportes, Clima y Actualidad. Cobertura en vivo, solo para ti.
      </p>
      <a href="#" class="btn-primary">Ver Noticias</a>
    </div>
  </header>

  <script src="script.js"></script>
</body>
</html>
